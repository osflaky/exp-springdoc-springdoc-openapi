# Builds and tests every pull request.
name: CI

on:
  workflow_dispatch:

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B --no-transfer-progress -Dmaven.artifact.threads=16
  MAVEN_OPTS: -Xmx3g

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, 
            macos-15-intel, macos-latest]
        java: ['21']
      fail-fast: false
      max-parallel: 6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - uses: actions/setup-java@v4
      with:
        java-version: '${{ matrix.java }}'
        distribution: temurin
        cache: maven

      # frontend-maven-plugin runs npm install for springdoc-openapi-starter-common-mcp.
    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ hashFiles('**/src/main/frontend/package-lock.json') }}
        restore-keys: npm-

      # -Pci keeps skip.npm=false; -T1C matches the runner's core count.
    - name: Test
      run: mvn $MAVEN_ARGS -Pci -T1C test
    name: leg ${{ matrix.os }} | ${{ matrix.java }}
